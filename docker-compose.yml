version: '2'
services:
  metrics:
    image: influxdb:1.8.10
    ports:
      - '8086:8086'
    environment:
      INFLUXDB_DATA_ENGINE: tsm1
      INFLUXDB_DB: metrics
      INFLUXDB_USER: admin
      INFLUXDB_USER_PASSWORD: admin123

  grafana:
    image: grafana/grafana
    ports:
      - '3000:3000'
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123

  grafane:
    build:
      context: .
    depends_on:
      - "metrics"
    environment:
      INFLUXDB_HOST: metrics
      INFLUXDB_PORT: 8086
      INFLUXDB_DB: metrics
      INFLUXDB_USER: admin
      INFLUXDB_USER_PASSWORD: admin123
