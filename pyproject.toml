[tool.poetry]
name = "grafane"
version = "1.0.0"
description = "Opinionated InfluxDB client"
authors = ["Teofilo Sibileau <teo.sibileau@gmail.com>"]
readme = "README.md"
license = "CC-BY-NC-SA-4.0"
homepage = "https://gitlab.com/grafane/grafane"
repository = "https://gitlab.com/grafane/grafane"
keywords = ["influxdb", "grafana", "metrics", "time-series"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Database",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
packages = [{include = "grafane"}]

[tool.poetry.dependencies]
python = "^3.11"
influxdb = "5.2.1"
pytz = "*"
influxdb-client = {version = "^1.50.0", optional = true}

[tool.poetry.extras]
v2 = ["influxdb-client"]

[tool.poetry.group.dev.dependencies]
freezegun = "*"
pycodestyle = "*"
ipython = "*"
pytest = "^9.0.2"
pytest-freezegun = "^0.4.2"
setuptools = "*"
python-dotenv = "^1.2.2"


[tool.poetry.group.notebooks.dependencies]
notebook = "^7.5.4"
yfinance = "^1.2.0"

[tool.poetry.scripts]
grafane = "grafane.client:Grafane"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore::DeprecationWarning:influxdb.*",
    "ignore::DeprecationWarning:pytest_freezegun.*",
]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "v1: marks tests requiring InfluxDB v1",
    "v2: marks tests requiring InfluxDB v2",
]
