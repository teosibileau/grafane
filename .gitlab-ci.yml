stages:
  - unit
  - integration

# --- Unit tests (no services) ---
.unit_template:
  stage: unit
  before_script:
    - pip install poetry
    - poetry install
  script:
    - poetry run pytest tests -m "not integration"

unit:3.11:
  extends: .unit_template
  image: python:3.11

unit:3.12:
  extends: .unit_template
  image: python:3.12

# --- V1 integration tests (InfluxDB 1.8) ---
integration:v1:
  stage: integration
  image: python:3.12
  services:
    - name: influxdb:1.8.10
      alias: influxdb
  variables:
    INFLUXDB_HOST: influxdb
    INFLUXDB_PORT: 8086
    INFLUXDB_DB: metrics
    INFLUXDB_USER: admin
    INFLUXDB_USER_PASSWORD: admin123
  before_script:
    - pip install poetry
    - poetry install
  script:
    - poetry run pytest tests -m "integration and v1" -v

# --- V2 integration tests (InfluxDB 2.8) ---
integration:v2:
  stage: integration
  image: python:3.12
  services:
    - name: influxdb:2.8
      alias: influxdb-v2
  variables:
    DOCKER_INFLUXDB_INIT_MODE: setup
    DOCKER_INFLUXDB_INIT_USERNAME: admin
    DOCKER_INFLUXDB_INIT_PASSWORD: admin123
    DOCKER_INFLUXDB_INIT_ORG: my-org
    DOCKER_INFLUXDB_INIT_BUCKET: metrics
    DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: my-super-secret-token
    INFLUXDB_V2_URL: http://influxdb-v2:8086
    INFLUXDB_V2_TOKEN: my-super-secret-token
    INFLUXDB_V2_ORG: my-org
    INFLUXDB_V2_BUCKET: metrics
  before_script:
    - pip install poetry
    - poetry install -E v2
  script:
    - poetry run pytest tests -m "integration and v2" -v
